name: Bug Report
description: Report a problem in JERVIS-X
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve JERVIS-X.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly describe the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the commands or steps that caused the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: Explain what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Result
      description: Paste the error message or describe what happened.
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: "Example: Python 3.13"

  - type: input
    id: operating_system
    attributes:
      label: Operating System
      placeholder: "Example: Windows 11"

  - type: checkboxes
    id: checks
    attributes:
      label: Final Checks
      options:
        - label: I removed passwords, API keys, and personal information.
          required: true
        - label: I searched existing issues for the same problem.
          required: true