name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Windows package
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: JERVIS-X-Windows-${{ github.ref_name }}
          path: |
            dist/JERVIS-X-Windows.zip
            dist/JERVIS-X-Windows.zip.sha256
          retention-days: 30


      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/JERVIS-X-Windows.zip" `
            "dist/JERVIS-X-Windows.zip.sha256" `
            --title "JERVIS-X ${{ github.ref_name }}" `
            --generate-notes
